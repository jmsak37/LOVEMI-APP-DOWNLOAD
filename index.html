<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d28d9">
  <meta name="description" content="Download the official LOVEMI Android app.">
  <title>Download LOVEMI for Android</title>
  <style>
    :root {
      color-scheme: light;
      --purple: #6d28d9;
      --pink: #db2777;
      --ink: #24172f;
      --muted: #766b80;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 15%, rgba(219,39,119,.12), transparent 32%),
        radial-gradient(circle at 88% 85%, rgba(109,40,217,.14), transparent 34%),
        #faf8ff;
    }
    main {
      width: min(100%, 460px);
      padding: clamp(30px, 7vw, 52px) 24px;
      text-align: center;
      background: rgba(255,255,255,.94);
      border: 1px solid #eee5fa;
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(62, 25, 95, .12);
    }
    .brand {
      margin: 0 0 12px;
      font-size: clamp(38px, 10vw, 52px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 800; }
    .description {
      margin: 12px auto 28px;
      max-width: 320px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }
    .download {
      min-height: 58px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 20px;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(120deg, var(--purple), var(--pink));
      box-shadow: 0 12px 26px rgba(109,40,217,.24);
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .download:hover { transform: translateY(-2px); box-shadow: 0 16px 32px rgba(109,40,217,.30); }
    .download:focus-visible { outline: 3px solid #c4b5fd; outline-offset: 4px; }
    .download svg { width: 22px; height: 22px; flex: 0 0 auto; }
    .note { margin: 17px 0 0; color: #93879e; font-size: 11px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand" aria-label="LOVEMI">LOVEMI</p>
    <h1>Get the LOVEMI Android App</h1>
    <p class="description">Download the official LOVEMI app and open LOVEMI on your Android device.</p>
    <a class="download" href="https://github.com/jmsak37/LOVEMI-APP-DOWNLOAD/releases/latest/download/LOVEMI.apk" aria-label="Download LOVEMI for Android">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3.5v11m0 0 4.2-4.2M12 14.5l-4.2-4.2M4.5 16.5v2.2c0 .99.81 1.8 1.8 1.8h11.4c.99 0 1.8-.81 1.8-1.8v-2.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Click Me to Download
    </a>
    <p class="note">Official Android APK download</p>
  </main>
</body>
</html>
